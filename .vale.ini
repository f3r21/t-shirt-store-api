# Prose lint for the two pages a reviewer reads: README.md and ARCHITECTURE.md.
# `npm run docs:lint` runs it locally, the Prose job runs it in CI. Vale exits
# non-zero only on error-level alerts, so the gate is the set of rules that
# carry that level below; warnings are reported and do not fail the build.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google
Vocab = TShirtStore

[*.md]
BasedOnStyles = Vale, Google

# Both pages are argued prose in the author's voice: first person, uncontracted
# negatives and the occasional passive are the voice, not defects. A gate that
# failed on them would be switched off within a week, so these four are off.
Google.FirstPerson = NO
Google.We = NO
Google.Contractions = NO
Google.Passive = NO

# The gate. Vale fails the build only on error-level alerts, and these three are
# the ones worth failing on: a heading not in sentence case, a word the
# dictionary and the project vocabulary both lack, and a project term spelled
# against its own capitalization. Everything else stays a warning: reported in
# the run, never a red build.
Google.Headings = error
Vale.Spelling = error
Vale.Terms = error
