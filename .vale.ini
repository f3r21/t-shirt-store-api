# Prose lint for README.md, ARCHITECTURE.md, contract/README.md and docs/decisions.
# `npm run docs:lint` runs it locally, the Prose job runs it in CI. Vale fails only
# on error-level alerts: headings, spelling, project terms and the AiSigns word
# list. The Readability scores and the register phrases are warnings, never red.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google, Readability
Vocab = TShirtStore

[*.md]
BasedOnStyles = Vale, Google, Readability, TShirtStore

# Argued prose in the author's voice: first person, uncontracted negatives and
# the occasional passive are the voice, so these four are off.
Google.FirstPerson = NO
Google.We = NO
Google.Contractions = NO
Google.Passive = NO

Google.Headings = error
Vale.Spelling = error
Vale.Terms = error
