name: CI

# Every branch, on push. `main` has never taken a merge and the one pull request
# is the working branch itself, so a `push` plus `pull_request` pair would run
# every job twice on every push to it.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push makes an older run obsolete, except where a run may be releasing:
# on main and on the working branch the run is the record of what that commit
# passed, and a release in flight is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main", "refs/heads/feat/week-3-auth"]'), github.ref) }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      # Same major version and published port as docker-compose.yml, so a failure
      # here reproduces locally with one connection string. The database name is
      # the one test/setup-e2e.ts falls back to.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tshirt_store_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # The queue's Redis, the same major as docker-compose.yml. Database 1 is
      # what test/setup-e2e.ts falls back to.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tshirt_store_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tshirt_store_test
      # The stock notification queue opens this at boot; it points at the
      # service container above.
      REDIS_URL: redis://localhost:6379/1
      # `npm ci` runs the `prepare` script, which installs git hooks. A runner
      # makes no commits.
      HUSKY: '0'
      # A clean checkout has no .env, and `validateEnv` stops the boot without
      # these five, so `app.module.spec.ts` cannot compile the module. They are
      # throwaway values that exist to satisfy the validator, never credentials:
      # nothing here reaches a mail provider or Stripe, and the tokens signed
      # with this secret live only inside one job.
      JWT_SECRET: ci-only-value-not-a-secret-000000
      REFRESH_TOKEN_PEPPER: ci-only-value-not-a-secret-000000
      MAIL_FROM: ci@example.com
      STRIPE_SECRET_KEY: sk_test_ci-only-value
      STRIPE_WEBHOOK_SECRET: whsec_ci-only-value
      S3_BUCKET: ci-only-bucket
      IMAGES_BASE_URL: https://images.example

    steps:
      # Actions are pinned to a commit. A tag moves, and an action runs on the
      # runner holding the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Prisma CLI downloads a schema engine and keeps it here. The client
      # itself ships no engine, because schema.prisma uses the `prisma-client`
      # generator and PrismaService supplies a driver adapter.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: prisma-engines-${{ runner.os }}-

      - run: npm ci

      # The closure the Dockerfile ships is `npm ci --omit=dev`, so that is the
      # tree audited here. High and critical fail the job. The two `overrides`
      # in package.json exist because of this step; DECISIONS 20 says why.
      - name: Audit the production dependency tree
        run: npm audit --omit=dev --audit-level=high

      # src/generated is not in version control, and 15 files import from it, so
      # nothing below this step compiles without it.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

      - name: Apply the migrations
        run: npx prisma migrate deploy

      # Catches a schema edit that was never turned into a migration. Exit code 2
      # means the two disagree.
      - name: Schema matches the migrated database
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: End to end tests
        run: npm run test:e2e

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the runtime image
        run: docker build --tag t-shirt-store-api:${{ github.sha }} .

  # The two pages a reviewer reads, linted with the Google developer style
  # through Vale. The rule selection and the vocabulary live in .vale.ini and
  # .vale/styles/config; the action downloads the Google package itself. Vale
  # exits non-zero only on error-level alerts, so the gate is exactly the rules
  # .vale.ini promotes to that level. `checks: write` is what the check reporter
  # needs on a workflow that runs on push and never on a pull request.
  prose:
    name: Prose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: README.md,ARCHITECTURE.md
          separator: ','
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: true

  # The release, on every push to the two refs, once the checks above are green:
  # build on an arm runner (the instance is arm64), push both images, point the
  # migrate task at this commit, run the migrations as a one-off task, roll the
  # service to the tag, and prove the running task carries this commit. The
  # credentials are a short-lived OIDC token exchanged for the deploy role, so
  # no key is stored anywhere; the stack itself is changed through its own
  # service role, so this job never holds a permission on an instance, a
  # database or a role. infra/ci.yml is the trust, DECISIONS 30 the reasons.
  deploy:
    name: Deploy
    needs: [verify, image]
    if: github.ref == 'refs/heads/feat/week-3-auth' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      STACK: tshirt
      CLUSTER: tshirt
      REGISTRY_NAME: tshirt-store-api
      LOG_GROUP: /ecs/tshirt
      # The two role ARNs carry the account id, which is why they are repository
      # variables and not literals in a public file.
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      STACK_ROLE_ARN: ${{ vars.AWS_STACK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The tag is the commit, so the registry says what runs and a stale local
      # image can never be pushed by hand, which DECISIONS 29 records happening.
      - name: Name the tag after the commit
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to the registry
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Build both images from this commit
        run: |
          docker build --tag "$REGISTRY/$REGISTRY_NAME:$TAG" .
          docker build --target migrate --tag "$REGISTRY/$REGISTRY_NAME:$TAG-migrate" .

      - name: Push both images
        run: |
          docker push "$REGISTRY/$REGISTRY_NAME:$TAG"
          docker push "$REGISTRY/$REGISTRY_NAME:$TAG-migrate"

      # Registry, then migrate, then roll the tag. This update changes one task
      # definition and no service, so the migrations run from the new image
      # before any container of it takes traffic.
      - name: Point the migrate task at this commit
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file infra/stack.yml \
            --capabilities CAPABILITY_IAM --role-arn "$STACK_ROLE_ARN" \
            --no-fail-on-empty-changeset --parameter-overrides "MigrateImageTag=$TAG"

      - name: Run the migrations
        run: |
          OUT=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$STACK-migrate" --launch-type EC2 --output json)
          TASK=$(jq -r '.tasks[0].taskArn // empty' <<<"$OUT")
          if [ -z "$TASK" ]; then echo 'The task was not placed:'; jq '.failures' <<<"$OUT"; exit 1; fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "migrate/migrate/${TASK##*/}" \
            --query 'events[].message' --output text | tr '\t' '\n'
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT" = "0"

      - name: Roll the service to this commit
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file infra/stack.yml \
            --capabilities CAPABILITY_IAM --role-arn "$STACK_ROLE_ARN" \
            --no-fail-on-empty-changeset --parameter-overrides "ImageTag=$TAG"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$STACK-app"

      # The proof the by-hand release lacked: the task that runs carries this
      # commit's tag, and the API answers through CloudFront.
      - name: Prove the running task is this commit
        run: |
          TASK=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$STACK-app" --query 'taskArns[0]' --output text)
          IMAGE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[?name==`api`].image' --output text)
          echo "running: $IMAGE"
          case "$IMAGE" in *":$TAG") ;; *) echo "expected the tag $TAG"; exit 1 ;; esac
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl -fsS --max-time 30 "$URL/v1"
